<!DOCTYPE html>

<head>

  <title>PathWise — Learning Roadmap</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..500,100;1,9..144,300,100&family=Jost:wght@300;400;500&display=swap" />
  <link rel="stylesheet" href="style.css" />

<body>

  <nav class="nav" id="main-nav" aria-label="Main navigation">
    <a class="nav__brand" href="index.html">PathWise</a>
    <ul class="nav__links">
      <li><a href="index.html" class="nav__link">Dashboard</a></li>
      <li><a href="skills.html" class="nav__link">My Skills</a></li>

    <section id="roadmap-content" aria-live="polite" aria-busy="true"></section>
