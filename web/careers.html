<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PathWise — Career Explorer</title>
  <meta name="description" content="Choose your target career on PathWise to see your personalised skill gap analysis and learning roadmap." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Inter:wght@300;400;500;600;700&display=swap" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <nav class="nav" id="main-nav" aria-label="Main navigation">
    <a class="nav__brand" href="index.html">PathWise</a>
    <ul class="nav__links">
      <li><a href="index.html"    class="nav__link">Dashboard</a></li>
      <li><a href="skills.html"   class="nav__link">My Skills</a></li>
      <li><a href="careers.html"  class="nav__link nav__link--active" aria-current="page">Career Explorer</a></li>
      <li><a href="gap.html"      class="nav__link">Skill Gap</a></li>

  </nav>

  <main class="main" id="main-content">
    <div class="editorial-split--career">
      <div class="editorial-split__text reveal">

        <img src="assets/pen_paper.png" alt="Data Strategy">
      </div>
    </div>

  <div id="toast-stack" aria-live="polite" aria-atomic="true"></div>
